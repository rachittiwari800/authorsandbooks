services:
  - type: web
    name: bookleaf-api
    runtime: node
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: bookleaf-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /var/data/bookleaf.db
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
